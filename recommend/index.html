<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockBuild - Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hero">
    <h1>BlockBuild</h1>
    <p>Manage customers, projects, and products — all in one place.</p>
    <div class="btn-group">
      <a href="login.html" class="btn btn-primary">Log In</a>
      <a href="signup.html" class="btn btn-secondary">Sign Up</a>
    </div>
  </div>
  <footer>
    <div class="page-visit-counter" style="display: inline-flex; margin-bottom: 0.5rem;">
      👁️ Visits: <strong id="visit-count">0</strong>
    </div>
    <p>&copy; 2026 BlockBuild</p>
  </footer>
  <script>
    // Page visit tracking
    (function() {
      const VISIT_KEY = 'blockbuild_visits';
      let visits = parseInt(localStorage.getItem(VISIT_KEY) || '0', 10);
      visits++;
      localStorage.setItem(VISIT_KEY, visits);
      const counter = document.getElementById('visit-count');
      if (counter) counter.textContent = visits;
    })();
  </script>
</body>
</html>
